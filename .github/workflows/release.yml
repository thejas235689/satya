name: Release

# Builds the CLI on every version tag and attaches it to that tag's release,
# so a published release always carries a runnable binary as well as the source.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and attach the binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          name="satya-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/satya README.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
          # A version-independent alias, so
          # releases/latest/download/satya-x86_64-linux.tar.gz always resolves
          # to the newest build. Without it, any documented install command
          # embeds a version number and breaks at the next release.
          alias="satya-x86_64-linux"
          mkdir -p "dist/$alias"
          cp target/release/satya README.md LICENSE "dist/$alias/"
          tar -czf "dist/$alias.tar.gz" -C dist "$alias"
          ( cd dist && sha256sum "$alias.tar.gz" > "$alias.tar.gz.sha256" )

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 --clobber
